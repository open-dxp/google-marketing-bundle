name: "Codeception Tests"

on:
    schedule:
        -   cron: '0 3 * * 1,3,5'
    pull_request:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
    push:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
            - "*_actions"

env:
    OPENDXP_PROJECT_ROOT: ${{ github.workspace }}
    APP_ENV: test
    OPENDXP_TEST: 1
    OPENDXP_TEST_DB_DSN: "mysql://root@127.0.0.1:33006/opendxp_test"

jobs:
    codeception-tests:
        name: "Codeception tests"
        runs-on: "ubuntu-22.04"
        continue-on-error: ${{ matrix.experimental }}
        env:
            OPENDXP_TEST_DB_DSN: "mysql://root@127.0.0.1:33006/opendxp_test"
        strategy:
            matrix:
                include:
                    - { php-version: 8.4, database: "mysql:8.4.4", dependencies: highest, opendxp_version: "1.x-dev as 1.0", experimental: false }
                    - { php-version: 8.4, database: "mariadb:11.8", dependencies: highest, opendxp_version: "1.x-dev as 1.0", experimental: false }
                    - { php-version: 8.4, database: "mariadb:10.5", dependencies: lowest, opendxp_version: "1.x-dev as 1.0", experimental: false }
                    - { php-version: 8.3, database: "mariadb:11.2", dependencies: highest, opendxp_version: "1.x-dev as 1.0", experimental: false }
                    - { php-version: 8.3, database: "mariadb:10.3", dependencies: lowest, opendxp_version: "1.x-dev as 1.0", experimental: false }
        services:
            mariadb:
                image: "${{ matrix.database }}"
                ports:
                    - 33006:3306
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes

        steps:
            -   name: "Checkout code"
                uses: "actions/checkout@v2"

            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    coverage: "none"
                    extensions: imagick
                    ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
                    php-version: "${{ matrix.php-version }}"

            -   name: Verify MariaDB connection
                run: |
                    cp .github/ci/files/.my.cnf ~/.my.cnf
                    while ! mysqladmin ping --silent; do
                      sleep 1
                    done
            -   name: "Setup OpenDXP environment"
                run: |
                    mysql -e "CREATE DATABASE opendxp_test CHARSET=utf8mb4;"
                    .github/ci/scripts/setup-opendxp-environment.sh
            -   name: "Update OpenDXP version"
                env:
                    OPENDXP_VERSION: "${{ matrix.opendxp_version }}"
                run: |
                    if [ ! -z "$OPENDXP_VERSION" ]; then
                          composer require --no-update open-dxp/opendxp:"${OPENDXP_VERSION}"
                    fi
            -   name: "Install dependencies with Composer"
                uses: "ramsey/composer-install@v2"
                with:
                    dependency-versions: "${{ matrix.dependencies }}"

            -   name: "Run Codeception"
                run: "vendor/bin/codecept run -c . -vvv --xml"

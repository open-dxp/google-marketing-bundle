#opendxp_google_marketing:
    #client_id: <client-id>.apps.googleusercontent.com
    #email: <service-account>@developer.gserviceaccount.com
    #simple_api_key: <simple-api-key>
    #browser_api_key: <browser-api-key>


services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    #
    # EVENT LISTENERS
    #


    OpenDxp\Bundle\GoogleMarketingBundle\EventListener\Frontend\GoogleSearchConsoleVerificationListener: ~

    OpenDxp\Bundle\GoogleMarketingBundle\EventListener\Frontend\GoogleAnalyticsCodeListener:
        public: true
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -110 }

    OpenDxp\Bundle\GoogleMarketingBundle\EventListener\Frontend\GoogleTagManagerListener:
        public: true
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -108 }

